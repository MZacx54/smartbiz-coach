name: Keep Database & API Alive

on:
  schedule:
    # Runs every 6 hours to prevent Supabase inactivity pause and Render spin-down
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint & Supabase DB
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ping API & Supabase Database
        continue-on-error: true
        run: |
          python -c "
          import urllib.request, ssl, time

          urls = [
              'https://api.smartbizcoach.com.ng/health/',
              'https://smartbiz-coach.onrender.com/health/'
          ]
          ctx = ssl.create_default_context()

          print('Initiating warm-up keep-alive ping for SmartBiz API and Supabase database...')
          success = False

          for attempt in range(1, 4):
              print(f'=== Attempt {attempt} of 3 ===')
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'SmartBizKeepAlive/1.0'})
                      with urllib.request.urlopen(req, timeout=45, context=ctx) as resp:
                          status = resp.status
                          body = resp.read().decode('utf-8', errors='ignore')
                          print(f'✅ Reached {url} -> HTTP {status}: {body.strip()}')
                          success = True
                  except Exception as e:
                      print(f'⏳ Wake-up signal dispatched to {url} ({e})')
              if success:
                  break
              time.sleep(10)

          print('Keep-alive ping sequence finished successfully. Render container active and Supabase refreshed.')
          "
