name: Keep-Alive Supabase Ping

on:
  schedule:
    # Runs every 6 hours to ensure Supabase database never pauses due to inactivity
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SmartBiz Backend Database Health Endpoint
        run: |
          echo "Pinging primary API..."
          curl -s -X GET "https://api.smartbizcoach.com.ng/health/" || true
          echo "Pinging fallback domain..."
          curl -s -X GET "https://smartbiz-coach.onrender.com/health/" || true
          echo "Supabase keep-alive ping sequence completed!"
